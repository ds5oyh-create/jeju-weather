name: Daily Jeju Weather Weight Updater

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeju-weather-daily-update
  cancel-in-progress: false

jobs:
  update-weights:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 4. 제주 16개 관측소 스냅샷 저장 및 실측 채점
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
        run: |
          echo "KMA_AUTH_KEY length: ${#KMA_AUTH_KEY}"
          python app.py --auto-update

      - name: 5. 갱신된 장부·스냅샷·감사 로그 안전 저장
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "JejuWeatherBot"
          git add jeju_weather_data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update daily ensemble weights and snapshots"
            git pull --rebase --autostash origin main
            git push origin main
          fi
