name: Daily Jeju Weather Weight Updater

on:
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weights:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 4. 제주 16개 관측소 실측 채점 및 카카오톡 아침 브리핑 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ALERT_REGION: "함덕"
        run: python app.py --auto-update

      - name: 5. 갱신된 가중치 장부(JSON) 및 감사 로그(CSV) 저장
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "JejuWeatherBot"
          git add jeju_weather_data/
          git diff --staged --quiet || git commit -m "Auto-update daily ensemble weights"
          git push
